name: Release npm package

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver bump to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.new_version }}
      publish_ref: ${{ steps.version.outputs.publish_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        id: version
        shell: bash
        run: |
          NEW_VERSION="$(npm version "${{ inputs.release_type }}" --no-git-tag-version | sed 's/^v//')"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish_ref=refs/tags/v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        shell: bash
        run: |
          git add package.json package-lock.json
          git commit -m "release: v${{ steps.version.outputs.new_version }}"

      - name: Create git tag
        run: git tag "v${{ steps.version.outputs.new_version }}"

      - name: Push commit and tag
        shell: bash
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${{ steps.version.outputs.new_version }}"

  publish-release:
    needs: prepare-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      ref: ${{ needs.prepare-release.outputs.publish_ref }}
    secrets: inherit
