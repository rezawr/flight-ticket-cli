name: Publish npm package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish from
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify ref matches package version
        shell: bash
        run: |
          RAW_REF="${{ inputs.ref }}"
          TAG_NAME="${RAW_REF##refs/tags/}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "Publish ref (${RAW_REF}) does not match package version (${PACKAGE_VERSION})."
            exit 1
          fi

      - name: Verify version is not already published
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
